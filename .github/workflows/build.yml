name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      # Backup our custom files
      - name: Backup custom files
        run: |
          mkdir -p /tmp/backup/lib
          cp pubspec.yaml /tmp/backup/
          cp -r lib/. /tmp/backup/lib/

      # Generate full Flutter project structure
      - name: Generate Flutter project
        run: flutter create --org com.muba --project-name vetstock .

      # Restore our custom files (overwrite Flutter defaults)
      - name: Restore custom files
        run: |
          cp /tmp/backup/pubspec.yaml .
          rm -rf lib
          mkdir -p lib
          cp -r /tmp/backup/lib/. lib/

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: muba-apk
          path: build/app/outputs/flutter-apk/app-release.apk
